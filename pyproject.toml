[project]
name = "hedge-forge"
version = "0.1.0"
description = "Portfolio optimization and risk modeling platform"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Core scientific computing
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",

    # Machine learning
    "scikit-learn>=1.0.0",

    # Optimization
    "cvxpy>=1.2.0",

    # Visualization
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",

    # Configuration
    "pyyaml>=6.0",

    # Documentation
    "quarto>=0.1.0",

    # Interactive dashboards
    "streamlit>=1.20.0",

    # Database / analytics
    "duckdb>=0.7.0",

    # Additional ML libraries
    "lightgbm>=3.3.0",
    "xgboost>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=3.0.0",
    "mypy>=0.950",
    "pre-commit>=4.6.1",
]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hedge_forge"]
