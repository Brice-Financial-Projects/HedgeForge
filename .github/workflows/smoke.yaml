name: Smoke Test

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🐍 Match local environment
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 🧰 Install uv and restore environment
      - name: Install uv and sync dependencies
        run: |
          pip install uv==0.9.7
          uv sync --frozen --all-extras
          uv run python --version

      # ✅ Minimal smoke test (unit tests only)
      - name: Run smoke tests
        run: |
          uv run pytest tests/unit_tests -q --disable-warnings --maxfail=1
